name: Copiar IBM ACE a GHCR

on:
  workflow_dispatch:
    inputs:
      ace_version:
        description: "Versión ACE publicada por IBM, por ejemplo 13.0.9.0-r1"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-ibm-ace-ghcr
  cancel-in-progress: false

env:
  ACE_VERSION: ${{ inputs.ace_version }}
  SOURCE_REPOSITORY: cp.icr.io/cp/appc/ace
  DESTINATION_REPOSITORY: ghcr.io/dlnklab/ace

jobs:
  copy:
    name: ACE ${{ inputs.ace_version }} / Linux AMD64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Validar la versión solicitada
        run: |
          set -euo pipefail
          if [[ ! "$ACE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
            echo "::error::La versión no tiene el formato esperado, por ejemplo 13.0.9.0-r1."
            exit 1
          fi

      - name: Instalar Skopeo
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Rechazar un destino con acceso público
        id: privacy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          def main():
              token_url = "https://ghcr.io/token?service=ghcr.io&scope=repository:dlnklab/ace:pull"
              try:
                  with urlopen(token_url, timeout=30) as response:
                      token = json.load(response)["token"]
                  if not token:
                      raise ValueError("GHCR no devolvió un token válido.")
              except HTTPError as error:
                  if error.code in (401, 403, 404):
                      print("GHCR no permite obtener acceso anónimo al destino.")
                      return
                  raise
              request = Request(
                  "https://ghcr.io/v2/dlnklab/ace/tags/list",
                  headers={"Authorization": "Bearer " + token},
              )
              try:
                  with urlopen(request, timeout=30):
                      pass
              except HTTPError as error:
                  if error.code in (401, 403, 404):
                      print("El destino no permite consultar etiquetas anónimamente.")
                      return
                  raise
              raise SystemExit("El destino GHCR es público. No se publicará una imagen IBM.")

          main()
          PY

      - name: Autenticar registros sin imprimir credenciales
        env:
          IBM_ENTITLEMENT_KEY: ${{ secrets.IBM_ENTITLEMENT_KEY }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          : "${IBM_ENTITLEMENT_KEY:?Falta el secreto IBM_ENTITLEMENT_KEY.}"
          printf '%s' "$IBM_ENTITLEMENT_KEY" | skopeo login \
            --authfile "$RUNNER_TEMP/ace-registry-auth.json" \
            --username cp --password-stdin cp.icr.io
          printf '%s' "$GHCR_TOKEN" | skopeo login \
            --authfile "$RUNNER_TEMP/ace-registry-auth.json" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io

      - name: Resolver el digest de origen
        id: source
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/ace-registry-auth.json"
          manifest="$RUNNER_TEMP/ace-source-manifest.json"
          source_reference="$SOURCE_REPOSITORY:$ACE_VERSION"
          if ! skopeo inspect --raw --authfile "$authfile" "docker://$source_reference" > "$manifest"; then
            echo "::error::No se pudo resolver la versión en el registro de IBM."
            exit 1
          fi
          # Se copia solo linux/amd64. Si el origen es un índice multiarquitectura,
          # se selecciona el digest de ese manifiesto; si es un manifiesto único, se usa el suyo.
          source_digest=$(python3 - "$manifest" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_bytes()
          document = json.loads(raw)
          manifests = document.get("manifests")
          if manifests is None:
              digest = "sha256:" + hashlib.sha256(raw).hexdigest()
          else:
              candidates = [
                  entry.get("digest")
                  for entry in manifests
                  if entry.get("platform", {}).get("os") == "linux"
                  and entry.get("platform", {}).get("architecture") == "amd64"
              ]
              candidates = [value for value in candidates if isinstance(value, str)]
              if len(candidates) != 1:
                  raise SystemExit("El índice de origen no contiene exactamente un manifiesto linux/amd64.")
              digest = candidates[0]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest or ""):
              raise SystemExit("El digest resuelto no tiene el formato esperado.")
          print(digest)
          PY
          )
          printf 'source_digest=%s\n' "$source_digest" >> "$GITHUB_OUTPUT"

      - name: Validar acceso y proteger la etiqueta existente
        env:
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/ace-registry-auth.json"
          destination_image="$DESTINATION_REPOSITORY:$ACE_VERSION"
          # GHCR crea paquetes nuevos con visibilidad privada por defecto.
          # Solo se acepta ausencia explícita; los demás fallos de acceso detienen la copia.
          if ! skopeo list-tags --authfile "$authfile" "docker://$DESTINATION_REPOSITORY" \
            > "$RUNNER_TEMP/ace-destination-tags.json" 2> "$RUNNER_TEMP/ace-tags-error.txt"; then
            if grep -Eiq 'name unknown|NAME_UNKNOWN' "$RUNNER_TEMP/ace-tags-error.txt"; then
              echo "El paquete aún no existe o no es visible. Se intentará la publicación privada con packages: write."
            else
              cat "$RUNNER_TEMP/ace-tags-error.txt"
              echo "::error::No se pudo comprobar el destino. Revise el acceso Write de dlnklab/dlnklab en Manage Actions access."
              exit 1
            fi
          fi
          if skopeo inspect --raw --authfile "$authfile" "docker://$destination_image" \
            > "$RUNNER_TEMP/ace-existing-manifest.json" 2> "$RUNNER_TEMP/ace-inspect-error.txt"; then
            current_digest=$(skopeo manifest-digest "$RUNNER_TEMP/ace-existing-manifest.json")
            if [[ "$current_digest" != "$SOURCE_DIGEST" ]]; then
              echo "::error::La etiqueta de destino ya contiene otro manifiesto ($current_digest != $SOURCE_DIGEST). No se sobrescribirá."
              exit 1
            fi
          elif ! grep -Eiq 'manifest unknown|name unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN' \
            "$RUNNER_TEMP/ace-inspect-error.txt"; then
            cat "$RUNNER_TEMP/ace-inspect-error.txt"
            exit 1
          fi

      - name: Copiar entre registros y verificar el digest
        env:
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/ace-registry-auth.json"
          destination_image="$DESTINATION_REPOSITORY:$ACE_VERSION"
          if ! skopeo copy --preserve-digests --retry-times 3 \
            --src-authfile "$authfile" \
            --dest-authfile "$authfile" \
            "docker://$SOURCE_REPOSITORY@$SOURCE_DIGEST" "docker://$destination_image"; then
            echo "::error::Falló la copia. Revise el error anterior, el acceso IBM y Write en Manage Actions access del paquete GHCR."
            exit 1
          fi
          skopeo inspect --raw --authfile "$authfile" \
            "docker://$destination_image" > "$RUNNER_TEMP/ace-published-manifest.json"
          published_digest=$(skopeo manifest-digest "$RUNNER_TEMP/ace-published-manifest.json")
          if [[ "$published_digest" != "$SOURCE_DIGEST" ]]; then
            echo "::error::El digest publicado no coincide con el origen resuelto."
            exit 1
          fi
          {
            echo '## Imagen verificada'
            printf '\n- Destino: `%s`\n' "$destination_image"
            printf -- '- Versión IBM: `%s`\n- Digest: `%s`\n' "$ACE_VERSION" "$published_digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retirar credenciales temporales del runner
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ["RUNNER_TEMP"]) / "ace-registry-auth.json").unlink(missing_ok=True)
          PY
